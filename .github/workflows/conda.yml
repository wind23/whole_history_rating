name: Conda

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest, macos-15-intel, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    runs-on: ${{ matrix.platform }}

    # The setup-miniconda action needs this to activate miniconda
    defaults:
      run:
        shell: "bash -l {0}"

    steps:
      - uses: actions/checkout@v7

      - name: Setup MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Temporarily rename Git's link.exe
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          if exist "C:\Program Files\Git\usr\bin\link.exe" (
            ren "C:\Program Files\Git\usr\bin\link.exe" "link.exe.bak"
          )

      - name: Get conda
        uses: conda-incubator/setup-miniconda@v4.1.0
        with:
          python-version: ${{ matrix.python-version }}
          channels: conda-forge

      - name: Prepare
        run: conda install -n base conda-build conda-verify

      - name: Build
        run: |
          # cmd.exe aborts the whole build script ("The input line is too long." + "The syntax
          # of the command is incorrect.") once an expanded batch line exceeds 8191 chars. The
          # vs2022_win-64 activation resets PATH with a "%PATH%" append right after vcvars64, and
          # on the runner's long stock PATH that expansion overflows, killing conda_build.bat
          # before pip ever runs. Keep the Windows build PATH tiny: conda + system dirs + MSYS
          # tools + the VS installer dir (the activation calls vswhere.exe).
          if [ "$RUNNER_OS" = "Windows" ]; then
            CONDAU=$(cygpath -u "${CONDA:-C:/Miniconda}")
            export PATH="$CONDAU:$CONDAU/Scripts:$CONDAU/Library/bin:$CONDAU/condabin:/c/Windows/system32:/c/Windows:/c/Program Files (x86)/Microsoft Visual Studio/Installer:/usr/bin:/bin"
          fi
          conda build --python ${{ matrix.python-version }} conda.recipe
        env:
          DISTUTILS_USE_SDK: 1
          MSSdk: 1

      - name: Restore Git's link.exe
        if: runner.os == 'Windows' && always()
        shell: cmd
        run: |
          if exist "C:\Program Files\Git\usr\bin\link.exe.bak" (
            ren "C:\Program Files\Git\usr\bin\link.exe.bak" "link.exe"
          )

      - name: Install
        run: conda install -c ${CONDA}/conda-bld/ whr

      - name: Install test dependencies
        run: conda install -y pytest

      - name: Test
        run: python -m pytest tests/
